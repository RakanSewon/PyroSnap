<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PyroSnap Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map { height: 100%; margin: 0; padding: 0; }
        #map { background: #aad3df; }
        .legend {
            background: rgba(255,255,255,0.9); padding: 6px 10px; border-radius: 6px;
            font: 12px sans-serif; line-height: 18px;
        }
        .legend i { display:inline-block; width:10px; height:10px; border-radius:50%;
            margin-right:6px; border:1px solid #fff; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Peta dipusatkan di Indonesia.
        var map = L.map('map', { attributionControl: true }).setView([-2.5, 118], 5);

        // Konfigurasi dari C# (DashboardView.InitMapAsync). Key tidak ditulis di sini.
        var config = window.PYROSNAP_CONFIG || {};

        // Peta dasar: CARTO (mengizinkan pemakaian langsung; OSM memblokir WebView).
        var cartoUrl = 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png' +
            (config.cartoKey ? '?key=' + encodeURIComponent(config.cartoKey) : '');
        var cartoLight = L.tileLayer(cartoUrl, {
            maxZoom: 19,
            subdomains: 'abcd',
            attribution: '© OpenStreetMap, © CARTO'
        }).addTo(map);

        // Layer alternatif: citra satelit Esri.
        var esriSat = L.tileLayer(
            'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles © Esri'
        });

        L.control.layers(
            { 'Peta': cartoLight, 'Satelit': esriSat },
            null,
            { position: 'topright' }
        ).addTo(map);

        var markers = [];

        // Aturan tingkat dari C# (Views/TingkatHotspot.cs, kelas LAPAN). Nilai cadangan
        // hanya dipakai bila halaman dibuka tanpa aplikasi.
        var tingkat = config.tingkat || {
            batasNominal: 30, batasTinggi: 80,
            warna: { tinggi: '#c81e1e', nominal: '#e68c00', rendah: '#e6c800' },
            label: { tinggi: 'Tinggi (≥ 80%)', nominal: 'Nominal (30–79%)', rendah: 'Rendah (< 30%)' }
        };

        function kelas(conf) {
            if (conf >= tingkat.batasTinggi) return 'tinggi';
            if (conf >= tingkat.batasNominal) return 'nominal';
            return 'rendah';
        }

        function namaKelas(conf) {
            var k = kelas(conf);
            return k.charAt(0).toUpperCase() + k.slice(1);
        }

        var selectedId = -1;

        function radius(conf) { var k = kelas(conf); return k === 'tinggi' ? 9 : k === 'nominal' ? 7 : 5; }

        // UX-13: tingkat Tinggi juga dibedakan dengan garis tepi gelap, bukan hanya warna.
        function gayaNormal(h) {
            var k = kelas(h.conf);
            return {
                radius: radius(h.conf), fillColor: tingkat.warna[k],
                color: k === 'tinggi' ? '#5a0000' : '#ffffff', weight: k === 'tinggi' ? 2 : 1.5,
                fillOpacity: 0.9
            };
        }

        // Dipanggil dari C#: menerima JSON array hotspot.
        // fit = true hanya setelah data baru dimuat; filter tidak mengubah posisi peta.
        function setHotspots(json, fit) {
            markers.forEach(function (m) { map.removeLayer(m); });
            markers = [];
            selectedId = -1;

            var data = JSON.parse(json);
            data.forEach(function (h) {
                var m = L.circleMarker([h.lat, h.lon], gayaNormal(h)).addTo(map);
                m.hotspot = h;

                m.bindTooltip(
                    'Koordinat: ' + h.lat.toFixed(3) + ', ' + h.lon.toFixed(3) +
                    '<br>Keyakinan deteksi: ' + namaKelas(h.conf) + ' (' + h.conf + '%)' +
                    '<br>Intensitas api (FRP): ' + h.frp + ' MW');

                // Klik marker -> kirim id ke C#.
                m.on('click', function () {
                    if (window.chrome && window.chrome.webview) {
                        window.chrome.webview.postMessage(String(h.id));
                    }
                });

                markers.push(m);
            });

            // Zoom otomatis ke kumpulan titik hanya bila diminta.
            if (fit && data.length > 0) {
                var group = L.featureGroup(markers);
                map.fitBounds(group.getBounds().pad(0.3));
            }
        }

        // Dipanggil dari C#: sorot hotspot yang dipilih di daftar (-1 = tidak ada).
        function highlightHotspot(id) {
            if (selectedId >= 0 && markers[selectedId]) {
                markers[selectedId].setStyle(gayaNormal(markers[selectedId].hotspot));
            }
            selectedId = id;
            var m = markers[id];
            if (!m) return;

            m.setStyle({ radius: radius(m.hotspot.conf) + 4, color: '#000000', weight: 3 });
            m.bringToFront();
            if (!map.getBounds().contains(m.getLatLng())) {
                map.panTo(m.getLatLng());
            }
        }

        // Dipanggil dari C#: fokus peta ke koordinat tertentu.
        function focusLocation(lat, lon, zoom) {
            map.setView([lat, lon], zoom || 7);
        }

        // Legenda dari konfigurasi tingkat (sama dengan legenda di aplikasi).
        var legend = L.control({ position: 'bottomright' });
        legend.onAdd = function () {
            var div = L.DomUtil.create('div', 'legend');
            var judul = document.createElement('b');
            judul.textContent = 'Keyakinan deteksi';
            div.appendChild(judul);
            ['tinggi', 'nominal', 'rendah'].forEach(function (k) {
                div.appendChild(document.createElement('br'));
                var i = document.createElement('i');
                i.style.background = tingkat.warna[k];
                if (k === 'tinggi') i.style.borderColor = '#5a0000';
                div.appendChild(i);
                div.appendChild(document.createTextNode(tingkat.label[k]));
            });
            return div;
        };
        legend.addTo(map);

        // Beri tahu C# bahwa peta sudah siap menerima data.
        if (window.chrome && window.chrome.webview) {
            window.chrome.webview.postMessage('MAP_READY');
        }
    </script>
</body>
</html>
